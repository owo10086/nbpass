<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Forwarder 功能截图预览</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e4e7ec; --text: #1d2433; --muted: #667085;
    --accent: #2f6fed; --accent-soft: #eaf1ff; --side: 268px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 侧栏 */
  aside { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  .brand b { display: block; font-size: 15px; }
  .brand span { color: var(--muted); font-size: 12px; }
  nav { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
  nav h4 { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
  nav button { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text); }
  nav button:hover { background: #f2f4f7; }
  nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav button:focus-visible { outline: 2px solid var(--accent); }
  nav .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav button.on .n { color: var(--accent); }

  /* 主区 */
  main { margin-left: var(--side); min-height: 100%; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 12px 28px; background: rgba(246,247,249,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header input { flex: 1; max-width: 420px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  header input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  header .stat { color: var(--muted); font-size: 13px; }
  .content { padding: 8px 28px 60px; }

  section.page { padding-top: 22px; scroll-margin-top: 64px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 4px; }
  .page-head .sec { font-size: 12px; color: var(--muted); }
  .page-head h2 { margin: 0; font-size: 20px; }
  .page-head .links { font-size: 12px; display: flex; gap: 10px; }
  .summary { margin: 0 0 14px; color: var(--muted); max-width: 820px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { all: unset; box-sizing: border-box; cursor: zoom-in; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
  .card:hover { box-shadow: 0 6px 20px rgba(16,24,40,.10); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 16 / 10; background: #eef0f3; overflow: hidden; border-bottom: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .cap { padding: 10px 12px 12px; }
  .cap .alt { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cap .where { margin-top: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pick { display: none; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; max-width: 40%; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }
  mark { background: #fff1b8; color: inherit; border-radius: 2px; }

  /* 大图预览 */
  .lb { position: fixed; inset: 0; z-index: 50; background: #0c1018; display: none; flex-direction: column; color: #e8ebf0; }
  .lb.open { display: flex; }
  .lb-top { display: flex; align-items: center; gap: 14px; padding: 12px 18px; font-size: 13px; }
  .lb-top .crumb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #aab2c0; }
  .lb-top .crumb b { color: #fff; font-weight: 600; }
  .lb-top .count { font-variant-numeric: tabular-nums; color: #aab2c0; }
  :where(.lb) button { all: unset; cursor: pointer; border-radius: 8px; color: #e8ebf0; }
  :where(.lb) button:focus-visible { outline: 2px solid #7aa7ff; }
  .lb-top button { padding: 6px 10px; background: rgba(255,255,255,.08); }
  .lb-top button:hover { background: rgba(255,255,255,.16); }
  .lb-stage { flex: 1; position: relative; overflow: auto; display: flex; }
  .lb-stage img { margin: auto; max-width: calc(100% - 140px); max-height: 100%; object-fit: contain; cursor: zoom-in; background: #fff; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lb-stage.zoom img { max-width: none; max-height: none; cursor: zoom-out; margin: 0 auto; }
  .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 72px; display: grid; place-items: center; font-size: 28px; background: rgba(255,255,255,.06); }
  .lb-nav:hover { background: rgba(255,255,255,.16); }
  .lb-prev { left: 12px; } .lb-next { right: 12px; }
  .lb-cap { padding: 12px 18px 16px; text-align: center; }
  .lb-cap .alt { font-size: 15px; color: #fff; }
  .lb-cap .meta { font-size: 12px; color: #8b94a5; margin-top: 2px; }
  .lb-strip { display: flex; gap: 6px; overflow-x: auto; padding: 0 18px 14px; scrollbar-width: thin; }
  .lb-strip button { flex: none; width: 76px; height: 48px; border-radius: 4px; overflow: hidden; opacity: .45; outline-offset: 0; }
  .lb-strip button.on { opacity: 1; outline: 2px solid #7aa7ff; }
  .lb-strip img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }

  @media (max-width: 820px) {
    aside { display: none; }
    #pick { display: block; }
    header { padding: 10px 14px; flex-wrap: wrap; }
    .content { padding: 8px 14px 40px; }
    main { margin-left: 0; }
    .lb-stage img { max-width: 100%; }
    .lb-nav { display: none; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><b>Zero Forwarder 功能截图</b><span id="brandStat"></span></div>
  <nav id="nav"></nav>
</aside>
<main>
  <header>
    <select id="pick" aria-label="选择功能页"></select>
    <input id="q" type="search" placeholder="搜索截图说明、小节或功能名…（按 / 聚焦）" autocomplete="off">
    <span class="stat" id="stat"></span>
  </header>
  <div class="content" id="content"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="截图预览">
  <div class="lb-top">
    <div class="crumb" id="lbCrumb"></div>
    <span class="count" id="lbCount"></span>
    <button id="lbZoom" title="原始尺寸 / 适应窗口（Z）">原始尺寸</button>
    <button id="lbOpen" title="在新标签页打开原图">新标签打开</button>
    <button id="lbClose" title="关闭（Esc）">关闭 ✕</button>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一张（←）">‹</button>
  <button class="lb-nav lb-next" id="lbNext" title="下一张（→）">›</button>
  <div class="lb-cap"><div class="alt" id="lbAlt"></div><div class="meta" id="lbMeta"></div></div>
  <div class="lb-strip" id="lbStrip"></div>
</div>

const DOCS = '../zeroforwarder-docs/';
const SITE = 'https://www.zeroforwarder.com/docs/';
const IMG = 'img/';

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const total = PAGES.reduce((n, p) => n + p.shots.length, 0);
const uniq = new Set(PAGES.flatMap(p => p.shots.map(s => s.f))).size;
$('brandStat').textContent = `${PAGES.length} 个功能页 · ${uniq} 张截图`;

let current = 'all';  // 'all' 或页面 slug
let query = '';
let visible = [];     // 当前可见截图，供大图翻页

function renderNav() {
  let html = `<button data-slug="all" class="${current === 'all' ? 'on' : ''}"><span>全部截图</span><span class="n">${total}</span></button>`;
  let sec = '';
  for (const p of PAGES) {
    if (p.section !== sec) { sec = p.section; html += `<h4>${esc(sec)}</h4>`; }
    html += `<button data-slug="${p.slug}" class="${current === p.slug ? 'on' : ''}"><span>${esc(p.title)}</span><span class="n">${p.shots.length}</span></button>`;
  }
  $('nav').innerHTML = html;
  let opts = `<option value="all">全部截图（${total}）</option>`, og = '';
  for (const p of PAGES) {
    if (p.section !== og) { if (og) opts += '</optgroup>'; og = p.section; opts += `<optgroup label="${esc(og)}">`; }
    opts += `<option value="${p.slug}">${esc(p.title)}（${p.shots.length}）</option>`;
  }
  $('pick').innerHTML = opts + '</optgroup>';
  $('pick').value = current;
}

function hl(text) {
  if (!query) return esc(text);
  const i = text.toLowerCase().indexOf(query.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + query.length)) + '</mark>' + esc(text.slice(i + query.length));
}

function matches(p, s) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [s.alt, s.h2, s.h3, p.title, p.section].some(t => t && t.toLowerCase().includes(q));
}

function render() {
  visible = [];
  let html = '';
  for (const p of PAGES) {
    if (current !== 'all' && p.slug !== current) continue;
    const shots = p.shots.filter(s => matches(p, s));
    if (!shots.length) continue;
    html += `<section class="page" id="p-${p.slug}">
      <div class="page-head">
        <span class="sec">${esc(p.section)}</span>
        <h2>${hl(p.title)}</h2>
        <span class="links"><a href="${DOCS}${p.slug}/index.md" target="_blank">本地文档</a><a href="${SITE}${p.slug}/" target="_blank" rel="noopener">官网原文 ↗</a></span>
      </div>
      <p class="summary">${esc(p.summary)}</p>
      <div class="grid">`;
    for (const s of shots) {
      const idx = visible.push({ p, s }) - 1;
      const where = [s.h2, s.h3].filter(Boolean).join(' › ');
      html += `<button class="card" data-i="${idx}" title="${esc(s.alt)}">
        <div class="thumb"><img src="${IMG}${s.f}" loading="lazy" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}"></div>
        <div class="cap"><div class="alt">${hl(s.alt || '（无说明）')}</div>${where ? `<div class="where">${hl(where)}</div>` : ''}</div>
      </button>`;
    }
    html += `</div></section>`;
  }
  $('content').innerHTML = html || `<div class="empty">没有匹配“${esc(query)}”的截图</div>`;
  $('stat').textContent = query || current !== 'all' ? `显示 ${visible.length} / ${total} 张` : `共 ${total} 张（${uniq} 张不重复）`;
}

function go(slug, push = true) {
  current = slug;
  renderNav();
  render();
  window.scrollTo(0, 0);
  if (push) history.replaceState(null, '', slug === 'all' ? location.pathname : '#' + slug);
  document.querySelector('nav button.on')?.scrollIntoView({ block: 'nearest' });
}

$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-slug]');
  if (b) go(b.dataset.slug);
});
$('content').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openLb(+c.dataset.i);
});
$('pick').addEventListener('change', e => go(e.target.value));
let qTimer;
$('q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = e.target.value.trim(); render(); }, 120);
});

/* 大图预览 */
let at = -1;
function openLb(i) {
  $('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('lbStrip').innerHTML = visible.map((v, j) =>
    `<button data-j="${j}" title="${esc(v.s.alt)}"><img src="${IMG}${v.s.f}" loading="lazy" alt=""></button>`).join('');
  show(i);
}
function closeLb() {
  $('lb').classList.remove('open');
  document.body.style.overflow = '';
  document.querySelector(`.card[data-i="${at}"]`)?.focus({ preventScroll: false });
}
function show(i) {
  at = (i + visible.length) % visible.length;
  const { p, s } = visible[at];
  $('lbStage').classList.remove('zoom');
  $('lbZoom').textContent = '原始尺寸';
  $('lbImg').src = IMG + s.f;
  $('lbImg').alt = s.alt;
  $('lbCrumb').innerHTML = `${esc(p.section)} › <b>${esc(p.title)}</b>${s.h2 ? ' › ' + esc(s.h2) : ''}${s.h3 ? ' › ' + esc(s.h3) : ''}`;
  $('lbCount').textContent = `${at + 1} / ${visible.length}`;
  $('lbAlt').textContent = s.alt || '（无说明）';
  $('lbMeta').textContent = `${s.w} × ${s.h} · ${s.f}`;
  $('lbStage').scrollTo(0, 0);
  document.querySelectorAll('#lbStrip button').forEach((b, j) => b.classList.toggle('on', j === at));
  document.querySelector(`#lbStrip button[data-j="${at}"]`)?.scrollIntoView({ inline: 'center', block: 'nearest' });
  for (const d of [1, -1]) new Image().src = IMG + visible[(at + d + visible.length) % visible.length].s.f;
}
function toggleZoom() {
  const z = $('lbStage').classList.toggle('zoom');
  $('lbZoom').textContent = z ? '适应窗口' : '原始尺寸';
}
$('lbPrev').onclick = () => show(at - 1);
$('lbNext').onclick = () => show(at + 1);
$('lbClose').onclick = closeLb;
$('lbZoom').onclick = toggleZoom;
$('lbImg').onclick = toggleZoom;
$('lbOpen').onclick = () => window.open($('lbImg').src, '_blank');
$('lbStage').addEventListener('click', e => { if (e.target === $('lbStage')) closeLb(); });
$('lbStrip').addEventListener('click', e => {
  const b = e.target.closest('button[data-j]');
  if (b) show(+b.dataset.j);
});

document.addEventListener('keydown', e => {
  if ($('lb').classList.contains('open')) {
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') show(at - 1);
    else if (e.key === 'ArrowRight') show(at + 1);
    else if (e.key === 'z' || e.key === 'Z') toggleZoom();
    else return;
    e.preventDefault();
  } else if (e.key === '/' && document.activeElement !== $('q')) {
    e.preventDefault(); $('q').focus();
  } else if (e.key === 'Escape' && document.activeElement === $('q')) {
    $('q').value = ''; query = ''; render(); $('q').blur();
  }
});

const start = location.hash.slice(1);
go(PAGES.some(p => p.slug === start) ? start : 'all', false);
</script>
</body>
</html>
