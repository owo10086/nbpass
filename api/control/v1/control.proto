syntax = "proto3";

package nbpass.control.v1;
option go_package = "nbpass/internal/controlpb";

service ControlService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream NodeReport) returns (stream PanelMessage);
}

message EnrollRequest { string installation_ticket = 1; }
message EnrollResponse { string node_id = 1; string token = 2; }

// 身份由认证 token 决定，node_id 仅用于向后兼容，服务端不得信任。
message NodeReport {
  Compatibility compatibility = 270;
  bool upgrade_only = 260;
  bytes upgrade_progress = 261;
  bool upgrade_capable = 262;
  // 票 36：仅活性报告携带；独立上报中的该载荷不参与恢复核对。
  RecoveryReport recovery = 200;
  bool rotation_recheck_capable = 180;
  bool checker_only = 140;
  repeated bytes checker_results = 141;
  uint32 exit_failover_version = 150;
  uint32 tunnel_rotation_version = 160;
  // 自测独立补报，只消费自测结果，不推进活性、探针、事件或配置确认。
  bool self_check_only = 90;
  repeated bytes self_check_results = 91;
  // 解析采样独立上报，不能推进活性、配置、探针或事件。
  bool dns_watch_only = 100;
  repeated DNSWatchResult dns_watch_results = 101;
  bool dns_watch_capable = 102;
  // 逐流授权能力独立于控制协议版本；旧节点不提前启用新授权。
  uint32 tunnel_authorization_version = 110;
  bool rotation_only = 80;
  RotationProgress rotation = 81;
  string node_id = 1;
  string process_instance = 2;
  uint32 protocol_version = 3;
  string software_version = 4;
  uint64 applied_revision = 5;
  string applied_digest = 6;
  uint64 attempted_revision = 7;
  string apply_error = 8;
  ProbeSample probe = 14;
  // 探针独立上报不推进 10 秒活性时间，也不改变配置应用状态。
  bool probe_only = 15;
  // 节点查询的出站公网 IPv4，不作为已验证可入站的业务地址。
  string public_ipv4 = 17;
  repeated Event events = 18;
  // 独立补报只处理事件，不改变活性、探针或配置状态。
  bool events_only = 19;
  // 仅配置报告携带；逐规则结果绑定本次完整快照的版本与摘要。
  repeated RuleApplyResult rule_results = 20;
  string attempted_digest = 21;
  // 停用/删除在磁盘检查点及运行时均已撤销；不能只根据快照缺失推断。
  bool revocations_applied = 22;
  // 流量只消费自身载荷与确认，不推进其他控制状态。
  bool traffic_only = 60;
  repeated RuleTraffic traffic = 61;
}

message RuleApplyResult {
  string rule_id = 1;
  uint64 applied_revision = 2;
  string apply_error = 3;
}

message ProbeSample {
  repeated ExitHealth exit_health = 150;
  uint64 sequence = 1;
  // 缺少的 key 表示缺测；单位及允许字段由 internal/probe 定义。
  map<string, double> values = 2;
}

// 配置为完整快照；缺失规则表示撤销，摘要覆盖版本与全部内容。
message PanelMessage {
  Compatibility compatibility = 270;
  bytes upgrade_manifest = 260;
  bool upgrade_only = 261;
  repeated bytes checker_tasks = 140;
  repeated string acknowledged_checker_ids = 141;
  repeated string acknowledged_self_check_ids = 90;
  repeated DNSWatchTask dns_watch_tasks = 100;
  RotationCommand rotation_command = 80;
  uint32 protocol_version = 1;
  uint64 desired_revision = 2;
  ConfigSnapshot snapshot = 3;
  repeated string acknowledged_event_ids = 15;
  repeated TrafficAck acknowledged_traffic = 60;
  bool traffic_only = 61;
}

// Ranges describe wire/state formats, independently of software release versions.
// No field means the protocol-1 baseline and its explicitly advertised feature flags.
message Compatibility {
  uint32 control_min = 270;
  uint32 control_max = 271;
  uint32 tunnel_min = 272;
  uint32 tunnel_max = 273;
  uint32 state_min = 274;
  uint32 state_max = 275;
  uint32 state_write = 276;
  repeated string capabilities = 277;
}

// 每个进程、规则、分钟桶内的累计业务字节；桶起点决定 24 小时补报期限。
message RuleTraffic {
  string process_instance = 60;
  uint64 sequence = 61;
  string rule_id = 62;
  int64 bucket_unix = 63;
  uint64 upload_bytes = 64;
  uint64 download_bytes = 65;
  uint64 active_connections = 66;
  string sampled_at = 67;
}
message TrafficAck {
  string process_instance = 60;
  uint64 sequence = 61;
}

message Event {
  string event_id = 1;
  string type = 2;
  string occurred_at = 3;
  uint64 config_revision = 4;
  string message = 5;
  EventGap gap = 6;
}

message EventGap {
  uint64 count = 1;
  string from = 2;
  string to = 3;
  string reason = 4;
}

message ConfigSnapshot {
  string outbound_ipv4 = 284;
  uint32 check_port = 140;
  bytes self_check_config = 90;
  uint64 revision = 1;
  string digest = 2;
  repeated ForwardRule rules = 3;
  repeated ExitGroup exit_groups = 40;
  TunnelServer tunnel_server = 41;
}

message ForwardRule {
  // 当前代次已由出口确认的候选；缺失仅兼容旧版单成员快照。
  repeated string authorized_exit_ids = 150;
  uint64 authorization_generation = 110;
  string id = 1;
  string entry_group_id = 2;
  uint32 listen_port = 3;
  string target_address = 4;
  AddressFamily target_family = 5;
  uint32 target_port = 6;
  bool allow_private = 7;
  RuleKind kind = 8;
  string exit_group_id = 40;
}

enum AddressFamily { ADDRESS_FAMILY_UNSPECIFIED = 0; ADDRESS_FAMILY_IPV4 = 1; }
enum RuleKind { RULE_KIND_UNSPECIFIED = 0; RULE_KIND_DIRECT = 1; RULE_KIND_TUNNEL = 40; }

// 票 08 使用字段号 40–59；授权代次与确认由票 09 扩展。
message TunnelEndpoint {
  string address_id = 280;
  string endpoint_config_digest = 281;
  string address_version = 220;
  string rotation_id = 160;
  repeated bytes trusted_certificates_pem = 161;
  string node_id = 40;
  string address = 41;
  uint32 port = 42;
  TunnelTransport transport = 43;
  string server_name = 44;
  bytes certificate_pem = 45;
  string entry_id = 46;
  string credential = 47;
}
message ExitGroup {
  string id = 40;
  ExitStrategy strategy = 41;
  repeated TunnelEndpoint exits = 42;
}
message TunnelPeer {
  repeated string additional_credentials = 160;
  string entry_id = 40;
  string credential = 41;
}
message TunnelGrant {
  string entry_id = 40;
  ForwardRule rule = 41;
}
message TunnelServer {
  string rotation_id = 160;
  uint32 listen_port = 40;
  TunnelTransport transport = 41;
  string server_name = 42;
  bytes certificate_pem = 43;
  bytes private_key_pem = 44;
  repeated TunnelPeer peers = 45;
  repeated TunnelGrant grants = 46;
}
enum TunnelTransport { TUNNEL_TRANSPORT_UNSPECIFIED = 0; TUNNEL_TRANSPORT_WSS = 40; }
enum ExitStrategy { EXIT_STRATEGY_UNSPECIFIED = 0; EXIT_STRATEGY_PRIMARY_BACKUP = 40; }

// 一次性命令独立于配置；秘密仅经已认证的执行节点控制流传输。
message RotationCommand {
 bytes recheck_config = 180;
 bool automatic = 182;
 uint64 recheck_revision = 181;
 string action_id = 80;
 string node_id = 81;
 string old_ip = 82;
 int64 expires_at = 83;
 bytes config_json = 84;
 string node_name = 85;
 int64 issued_at = 86;
 // 空值为原执行许可；reconcile / release 只操作已持久化动作，不调用商家。
 string operation = 120;
 uint64 control_sequence = 121;
}
message RotationProgress {
 repeated bytes recheck_rounds = 180;
 bool recheck_complete = 181;
 string action_id = 80;
 uint64 sequence = 81;
 string state = 82;
 string old_ip = 83;
 string new_ip = 84;
 uint32 attempts = 85;
 string reason = 86;
 bool unsafe_network = 87;
 uint64 control_sequence = 120;
 bool observation_complete = 121;
}

// 票 20：每个消息的新增字段均限制在 100–109。
message DNSWatchTask {
 string task_id = 100;
 string domain = 101;
 string resolver = 102;
 int64 expires_at = 103;
 int64 expected_version = 104;
 int64 round = 105;
}
message DNSWatchResult {
 string task_id = 100;
 repeated string ips = 101;
 bool failed = 102;
}

// 入口观测的出口链路状态，不代表出口到所有目标的可达性。
message ExitHealth {
  string address_id = 280;
  string endpoint_config_digest = 281;
  string address_version = 220;
  string exit_id = 150;
  string state = 151;
  uint32 consecutive_failures = 152;
  string last_probe = 153;
  string failure_class = 154;
  int64 recovery_since_unix = 155;
  int64 checked_at_unix = 156;
}

// 只包含恢复所需的去重与额度证据，不包含换 IP 凭据或请求模板。
message RecoveryReport {
 int64 observed_at = 203;
 RecoveryRotation current = 204;
 uint64 high_water = 200;
 int64 history_since = 201;
 repeated RecoveryRotation actions = 202;
}
message RecoveryRotation {
 RotationProgress progress = 203;
 string action_id = 200;
 int64 attempted_at = 201;
 string state = 202;
}
