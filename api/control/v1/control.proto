syntax = "proto3";

package nbpass.control.v1;
option go_package = "nbpass/internal/controlpb";

service ControlService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream NodeReport) returns (stream PanelMessage);
}

message EnrollRequest { string installation_ticket = 1; }
message EnrollResponse { string node_id = 1; string token = 2; }

// 身份由认证 token 决定，node_id 仅用于向后兼容，服务端不得信任。
message NodeReport {
  string node_id = 1;
  string process_instance = 2;
  uint32 protocol_version = 3;
  string software_version = 4;
  uint64 applied_revision = 5;
  string applied_digest = 6;
  uint64 attempted_revision = 7;
  string apply_error = 8;
  ProbeSample probe = 14;
  // 探针独立上报不推进 10 秒活性时间，也不改变配置应用状态。
  bool probe_only = 15;
  // 节点查询的出站公网 IPv4，不作为已验证可入站的业务地址。
  string public_ipv4 = 17;
  repeated Event events = 18;
  // 独立补报只处理事件，不改变活性、探针或配置状态。
  bool events_only = 19;
  // 流量只消费自身载荷与确认，不推进其他控制状态。
  bool traffic_only = 60;
  repeated RuleTraffic traffic = 61;
}

message ProbeSample {
  uint64 sequence = 1;
  // 缺少的 key 表示缺测；单位及允许字段由 internal/probe 定义。
  map<string, double> values = 2;
}

// 配置为完整快照；缺失规则表示撤销，摘要覆盖版本与全部内容。
message PanelMessage {
  uint32 protocol_version = 1;
  uint64 desired_revision = 2;
  ConfigSnapshot snapshot = 3;
  repeated string acknowledged_event_ids = 15;
  repeated TrafficAck acknowledged_traffic = 60;
  bool traffic_only = 61;
}

// 每个进程、规则、分钟桶内的累计业务字节；桶起点决定 24 小时补报期限。
message RuleTraffic {
  string process_instance = 60;
  uint64 sequence = 61;
  string rule_id = 62;
  int64 bucket_unix = 63;
  uint64 upload_bytes = 64;
  uint64 download_bytes = 65;
  uint64 active_connections = 66;
  string sampled_at = 67;
}
message TrafficAck {
  string process_instance = 60;
  uint64 sequence = 61;
}

message Event {
  string event_id = 1;
  string type = 2;
  string occurred_at = 3;
  uint64 config_revision = 4;
  string message = 5;
  EventGap gap = 6;
}

message EventGap {
  uint64 count = 1;
  string from = 2;
  string to = 3;
  string reason = 4;
}

message ConfigSnapshot {
  uint64 revision = 1;
  string digest = 2;
  repeated ForwardRule rules = 3;
  repeated ExitGroup exit_groups = 40;
  TunnelServer tunnel_server = 41;
}

message ForwardRule {
  string id = 1;
  string entry_group_id = 2;
  uint32 listen_port = 3;
  string target_address = 4;
  AddressFamily target_family = 5;
  uint32 target_port = 6;
  bool allow_private = 7;
  RuleKind kind = 8;
  string exit_group_id = 40;
}

enum AddressFamily { ADDRESS_FAMILY_UNSPECIFIED = 0; ADDRESS_FAMILY_IPV4 = 1; }
enum RuleKind { RULE_KIND_UNSPECIFIED = 0; RULE_KIND_DIRECT = 1; RULE_KIND_TUNNEL = 40; }

// 票 08 使用字段号 40–59；授权代次与确认由票 09 扩展。
message TunnelEndpoint {
  string node_id = 40;
  string address = 41;
  uint32 port = 42;
  TunnelTransport transport = 43;
  string server_name = 44;
  bytes certificate_pem = 45;
  string entry_id = 46;
  string credential = 47;
}
message ExitGroup {
  string id = 40;
  ExitStrategy strategy = 41;
  repeated TunnelEndpoint exits = 42;
}
message TunnelPeer {
  string entry_id = 40;
  string credential = 41;
}
message TunnelGrant {
  string entry_id = 40;
  ForwardRule rule = 41;
}
message TunnelServer {
  uint32 listen_port = 40;
  TunnelTransport transport = 41;
  string server_name = 42;
  bytes certificate_pem = 43;
  bytes private_key_pem = 44;
  repeated TunnelPeer peers = 45;
  repeated TunnelGrant grants = 46;
}
enum TunnelTransport { TUNNEL_TRANSPORT_UNSPECIFIED = 0; TUNNEL_TRANSPORT_WSS = 40; }
enum ExitStrategy { EXIT_STRATEGY_UNSPECIFIED = 0; EXIT_STRATEGY_PRIMARY_BACKUP = 40; }
