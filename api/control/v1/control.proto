syntax = "proto3";

package nbpass.control.v1;
option go_package = "nbpass/internal/controlpb";

service ControlService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream NodeReport) returns (stream PanelMessage);
}

message EnrollRequest { string installation_ticket = 1; }
message EnrollResponse { string node_id = 1; string token = 2; }

// 身份由认证 token 决定，node_id 仅用于向后兼容，服务端不得信任。
message NodeReport {
  bool rotation_only = 80;
  RotationProgress rotation = 81;
  string node_id = 1;
  string process_instance = 2;
  uint32 protocol_version = 3;
  string software_version = 4;
  uint64 applied_revision = 5;
  string applied_digest = 6;
  uint64 attempted_revision = 7;
  string apply_error = 8;
  ProbeSample probe = 14;
  // 探针独立上报不推进 10 秒活性时间，也不改变配置应用状态。
  bool probe_only = 15;
  // 节点查询的出站公网 IPv4，不作为已验证可入站的业务地址。
  string public_ipv4 = 17;
  repeated Event events = 18;
  // 独立补报只处理事件，不改变活性、探针或配置状态。
  bool events_only = 19;
}

message ProbeSample {
  uint64 sequence = 1;
  // 缺少的 key 表示缺测；单位及允许字段由 internal/probe 定义。
  map<string, double> values = 2;
}

// 配置为完整快照；缺失规则表示撤销，摘要覆盖版本与全部内容。
message PanelMessage {
  RotationCommand rotation_command = 80;
  uint32 protocol_version = 1;
  uint64 desired_revision = 2;
  ConfigSnapshot snapshot = 3;
  repeated string acknowledged_event_ids = 15;
}

message Event {
  string event_id = 1;
  string type = 2;
  string occurred_at = 3;
  uint64 config_revision = 4;
  string message = 5;
  EventGap gap = 6;
}

message EventGap {
  uint64 count = 1;
  string from = 2;
  string to = 3;
  string reason = 4;
}

message ConfigSnapshot {
  uint64 revision = 1;
  string digest = 2;
  repeated ForwardRule rules = 3;
}

message ForwardRule {
  string id = 1;
  string entry_group_id = 2;
  uint32 listen_port = 3;
  string target_address = 4;
  AddressFamily target_family = 5;
  uint32 target_port = 6;
  bool allow_private = 7;
  RuleKind kind = 8;
}

enum AddressFamily { ADDRESS_FAMILY_UNSPECIFIED = 0; ADDRESS_FAMILY_IPV4 = 1; }
enum RuleKind { RULE_KIND_UNSPECIFIED = 0; RULE_KIND_DIRECT = 1; }

// 一次性命令独立于配置；秘密仅经已认证的执行节点控制流传输。
message RotationCommand {
 string action_id = 80;
 string node_id = 81;
 string old_ip = 82;
 int64 expires_at = 83;
 bytes config_json = 84;
 string node_name = 85;
 int64 issued_at = 86;
}
message RotationProgress {
 string action_id = 80;
 uint64 sequence = 81;
 string state = 82;
 string old_ip = 83;
 string new_ip = 84;
 uint32 attempts = 85;
 string reason = 86;
 bool unsafe_network = 87;
}
